<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- Style sheet -->
     <link href="css/calculate.css" rel="stylesheet">
    

</head>
<body>
    <!-- Main calculator container -->
    <div class="calculator">
        <input type="text" placeholder="|" id="input-field" readonly>
 <!-- Control buttons -->
    <div>
    <button class="ac">AC</button>
    <button class="del">DEL</button>
    <button class="optr">%</button>
    <button class="optr">/</button>
    </div>
<!-- numerical and operator buttons -->
    <div>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button class="optr">*</button>
    </div>
     <div>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button class="optr">-</button>
    </div>
    <div>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button class="optr">+</button>
    </div>
     <div>
<!-- Equals button -->
    <button>00</button>
    <button>0</button>
    <button>.</button>
    <button class="eql">=</button>
    </div>
   </div>
    <script src="Javascript/script.js"></script>
</body>
</html>
